---
# jetstream's trivy config (core pack), written by `jetstream sync`.
# Temporary exceptions go in the repo's own .trivyignore.
exit-code: 1
severity:
  - CRITICAL
  - HIGH
  - MEDIUM

scan:
  skip-dirs:
    - .venv
    - node_modules

# Dev dependencies are scanned too: jetstream's tools in uv.lock, and a
# site's whole toolchain in package-lock.json. trivy reads this under pkg:,
# and silently ignores it anywhere else.
pkg:
  include-dev-deps: true
