---
# jetstream's CodeRabbit config (public pack), written by `jetstream sync`.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keys: https://docs.coderabbit.ai/reference/configuration
language: en-CA
early_access: false
enable_free_tier: true
reviews:
  profile: chill
  high_level_summary: true
  auto_review:
    ignore_usernames:
      - cloudfeaster-release[bot]  # release-please's pull requests: versions and CHANGELOG.md
      - dependabot[bot]  # dependency updates: mostly lockfiles, which CodeRabbit skips anyway; CI checks them
