---
# Written by `jetstream sync` from the packs in [tool.jetstream]; don't edit.
#
# Each ecosystem is checked daily, waits 7 days after a release before
# proposing it, and groups its updates into one security PR and one version
# PR. jetstream itself is updated by jetstream-update.yaml, which also runs
# jetstream sync.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "cloudfeaster-jetstream*"  # Dependabot names it with its extras, e.g. cloudfeaster-jetstream[core]
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/jetstream/node"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
