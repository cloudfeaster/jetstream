---
# Written by `jetstream sync` (core pack); don't edit.
#
# Makes the repo's Dependabot alerts match its scanners' exceptions
# (run-sync-dependabot-alerts.sh): every night, and whenever an exception
# file changes on main. GITHUB_TOKEN can't change Dependabot alerts, so this
# runs as the org's Dependabot alerts App, whose private key only main can
# read; .jetstream/docs/core/dependabot-alerts.md says how to set it up.
name: jetstream sync dependabot alerts

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [main]
    paths:
      - .jetstream/trivyignore
      - .trivyignore
      - .jetstream/pip-audit-ignore
      - .pip-audit-ignore
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: jetstream sync dependabot alerts
    runs-on: ubuntu-latest
    # The App's private key is a secret of this environment, which only main
    # can deploy to.
    environment: dependabot-alerts
    permissions:
      contents: read
    steps:
      - name: Get a token for the Dependabot alerts App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_ALERTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_ALERTS_APP_PRIVATE_KEY }}
          # Only Dependabot alerts, and only in this repo, even if the App is given more.
          permission-vulnerability-alerts: write

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # No Actions cache, as in jetstream-lint.yaml.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: Sync the Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run --no-sync run-sync-dependabot-alerts.sh
