---
# Written by `jetstream sync` from the packs in [tool.jetstream]; don't edit.
#
# Scans the repo's dependencies every night, so a new advisory fails here
# without anyone pushing. GitHub emails a failed run to whoever last changed
# the schedule below. Each pack adds its scanner as a step; every step runs
# even when an earlier one fails, so one finding can't hide another.
name: jetstream nightly SCA

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sca:
    name: jetstream nightly SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No Actions cache, as in jetstream-lint.yaml: jetstream wheels are
          # never kept anywhere but the machine that built them.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: trivy
        if: ${{ !cancelled() }}
        run: uv run --no-sync run-trivy.sh

      - name: pip-audit
        if: ${{ !cancelled() }}
        run: uv run --no-sync run-pip-audit.sh
