---
# Fails when a binary tool pinned in binaries.toml (mado, d2, gitleaks,
# trivy, jq) is behind a release that's cleared the 7-day cooldown, since
# Dependabot can't see those pins. GitHub emails a failed run to whoever
# last changed the schedule below; bump the pin with
# `bin/update-binary.py <tool>` (CONTRIBUTING.md "Keeping the binary tools
# current"). Not named jetstream-*.yaml: jetstream syncs itself, and sync
# deletes any jetstream-* workflow the release doesn't ship.
name: binary pins

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: binary pins are current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No Actions cache, as in jetstream-lint.yaml: jetstream wheels are
          # never kept anywhere but the machine that built them.
          enable-cache: false

      - name: Install jetstream's dev environment
        run: uv sync --locked

      - name: Check every binary pin is current
        env:
          GITHUB_TOKEN: ${{ github.token }}  # the API allows 60 requests an hour without one
        run: uv run --no-sync bin/update-binary.py --check
