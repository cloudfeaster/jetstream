---
# Written by `jetstream sync` (python pack); don't edit.
#
# Fails when one of the repo's [tool.uv] exclude-newer-package overrides no longer
# changes what uv locks, naming it, so it's removed (run-prune-exclude-newer-package.sh).
# GitHub emails a failed run to whoever last changed the schedule below.
name: jetstream prune exclude-newer-package

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune:
    name: jetstream prune exclude-newer-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # No Actions cache, as in jetstream-lint.yaml.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: Check each entry
        run: uv run --no-sync run-prune-exclude-newer-package.sh
