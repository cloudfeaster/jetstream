---
# Fails if any jetstream release has files attached. jetstream is published
# only as source, at its tags, and never as a built wheel: README.md "How
# jetstream is distributed" says why that matters for licensing.
name: release assets

on:  # yamllint disable-line rule:truthy
  release:
    types: [published, edited]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  no-release-assets:
    name: no release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that no release has files attached
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          with_assets=$(gh api --paginate "repos/${REPO}/releases" \
            --jq '.[] | select(.assets | length > 0) | "\(.tag_name): \([.assets[].name] | join(", "))"')
          if [[ -n "${with_assets}" ]]; then
            echo "::error::jetstream releases must have no files attached (README.md \"How jetstream is distributed\")"
            echo "${with_assets}"
            exit 1
          fi
          echo "No jetstream release has files attached."
