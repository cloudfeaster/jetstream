---
# Written by `jetstream sync` (core pack); don't edit.
#
# One job, "jetstream lint", so the org ruleset can require one stable
# status check. It runs what a developer's git hooks run (decision 10):
# uv sync installs jetstream's tools, then jetstream check and every
# pre-commit hook. Then the tests marked integration, which no hook runs,
# and each pack's build and its checks, so a pull request that breaks
# them can't merge: the ruleset requires this check, and no other.
name: jetstream lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded PR runs are cancelled; runs on main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: jetstream lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the history
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # No Actions cache: uv's cache would hold the built jetstream wheel,
          # with the tool binaries in it, and jetstream wheels are never kept
          # anywhere but the machine that built them (jetstream's README, "How
          # jetstream is distributed").
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: jetstream check
        run: uv run --no-sync jetstream check

      # The website pack's hooks need Node and the site's npm packages; its
      # .nvmrc says which Node. (jetstream itself has an .nvmrc, for its
      # tests of the website pack's scripts, but no npm packages.)
      - name: Install Node (website pack)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the site's npm packages (website pack)
        if: ${{ hashFiles('.nvmrc') != '' && hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: pre-commit hooks
        env:
          # CI's checkout of main is a branch, but no one is committing to it
          SKIP: no-commit-to-branch
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: integration tests
        if: ${{ !cancelled() }}
        run: uv run --no-sync run-integration-tests.sh

      # A file only the pack writes says it's there. Each step runs after a
      # failure before it, as the integration tests do, so one run shows
      # every failure; the site's checks need the site it built.
      - name: Build the site (website pack)
        id: site
        if: ${{ !cancelled() && hashFiles('.nvmrc') != '' && hashFiles('package-lock.json') != '' }}
        run: node_modules/.bin/astro build

      - name: Check the site's links (website pack)
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: uv run --no-sync run-lychee.sh

      - name: Check what the site publishes (website pack)
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: uv run --no-sync run-check-dist.sh

      # Nothing is kept: in jetstream itself the wheel holds the tools'
      # binaries, and a jetstream wheel is never kept anywhere but the
      # machine that built it (see above), and publishing any wheel needs a
      # licensing review first (licensing.md). Out of dist/, which is a
      # site's.
      - name: Build the sdist and wheel (python pack)
        if: ${{ !cancelled() && hashFiles('.jetstream/pip-audit-ignore') != '' }}
        run: uv build --out-dir "${RUNNER_TEMP}/uv-build"
