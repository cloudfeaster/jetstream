---
# Written by `jetstream sync` (core pack); don't edit.
#
# One job, "jetstream lint", so the org ruleset can require one stable
# status check. It runs what a developer's git hooks run (decision 10):
# uv sync installs jetstream's tools, then jetstream check and every
# pre-commit hook. Then the tests marked integration, which no hook runs.
name: jetstream lint

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded PR runs are cancelled; runs on main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: jetstream lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the history
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No Actions cache: uv's cache would hold the built jetstream wheel,
          # with the tool binaries in it, and jetstream wheels are never kept
          # anywhere but the machine that built them (jetstream's README, "How
          # jetstream is distributed").
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: jetstream check
        run: uv run --no-sync jetstream check

      # The website pack's hooks need Node and the site's npm packages; its
      # .nvmrc says which Node. (jetstream itself has an .nvmrc, for its
      # tests of the website pack's scripts, but no npm packages.)
      - name: Install Node (website pack)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the site's npm packages (website pack)
        if: ${{ hashFiles('.nvmrc') != '' && hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: pre-commit hooks
        env:
          # CI's checkout of main is a branch, but no one is committing to it
          SKIP: no-commit-to-branch
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: integration tests
        if: ${{ !cancelled() }}
        run: uv run --no-sync run-integration-tests.sh
