---
# The python pack's hooks. `jetstream sync` appends what follows the marker
# to core's hooks list; the lines above it make this file valid YAML.
repos:
  - repo: local
    hooks:
      # >>> jetstream: appended
      - id: ruff
        name: ruff (Python lint and format check)
        entry: run-ruff.sh
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: ty
        name: ty (Python type check)
        entry: run-ty.sh
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml|^uv\.lock)$'

      - id: bandit
        name: bandit (Python security scan)
        entry: run-bandit.sh
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: deptry
        name: deptry (Python dependency check)
        entry: run-deptry.sh
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml|^uv\.lock)$'

      - id: pyscn
        name: pyscn (Python code health score)
        entry: run-pyscn.sh
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: pip-audit
        name: pip-audit (vulnerable Python dependencies)
        entry: run-pip-audit.sh
        language: system
        pass_filenames: false
        always_run: true  # as trivy: a new advisory fails without a change

      - id: licensecheck
        name: licensecheck (Python dependency licenses)
        entry: run-licensecheck.sh
        language: system
        pass_filenames: false
        files: '^(uv\.lock|pyproject\.toml)$'
