---
# Written by `jetstream sync` (python pack); don't edit.
#
# Fails when an exception in the repo's .pip-audit-ignore no longer matches anything
# pip-audit finds, naming it, so it's removed before its exp: date
# (run-prune-pip-audit-ignore.sh). GitHub emails a failed run to whoever last changed
# the schedule below.
name: jetstream prune pip-audit-ignore

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune:
    name: jetstream prune pip-audit-ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # No Actions cache, as in jetstream-lint.yaml.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: Check each exception
        run: uv run --no-sync run-prune-pip-audit-ignore.sh
