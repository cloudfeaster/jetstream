---
# Written by `jetstream sync` (python pack); don't edit.
#
# Fails when one of the repo's [tool.uv] constraint-dependencies entries no longer
# changes what uv locks, naming it, so it's removed (run-prune-constraints.sh).
# GitHub emails a failed run to whoever last changed the schedule below.
name: jetstream prune constraints

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune:
    name: jetstream prune constraints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No Actions cache, as in jetstream-lint.yaml.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: Check each entry
        run: uv run --no-sync run-prune-constraints.sh
