---
# Written by `jetstream sync` (website pack); don't edit.
#
# Checks the built site against jetstream's Lighthouse budgets every night
# (run-lighthouse.sh). It's slow (3 runs of each page), so it isn't part of
# jetstream-website-ci.yaml, and doesn't hold up a pull request or a deploy.
# GitHub emails a failed run to whoever last changed the schedule below.
name: jetstream website Lighthouse

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: jetstream website Lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No Actions cache, as in jetstream-lint.yaml.
          enable-cache: false

      - name: Install jetstream and its tools
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the site's npm packages
        run: npm ci

      - name: Build the site
        run: node_modules/.bin/astro build

      - name: Check the Lighthouse budgets
        # the runner's Chrome is Google's package, which can use its sandbox
        run: uv run --no-sync run-lighthouse.sh
