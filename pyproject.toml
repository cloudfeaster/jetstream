[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "cloudfeaster-jetstream"
version = "0.1.3"
description = "Shared development infrastructure for Cloudfeaster repos: one pinned toolchain, its configuration, CI workflows and Claude Code plugins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
authors = [
    {name = "Cloudfeaster Solutions Inc."},
]
dependencies = [
    "tomlkit==0.15.2",  # jetstream sync edits pyproject.toml, keeping its comments and formatting
]

[project.optional-dependencies]
# One extra per pack. Each pack's Python tools are exact-pinned here;
# binary and Node tools are bundled into the wheel by hatch_build.py.
core = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",  # the unit-tests hook
    "shellcheck-py==0.11.0.1",
    "yamllint==1.38.0",
    "zizmor==1.32.0",
]
python = []
website = []

[project.scripts]
jetstream = "jetstream.cli:main"

[project.urls]
Repository = "https://github.com/cloudfeaster/jetstream"
Issues = "https://github.com/cloudfeaster/jetstream/issues"

[dependency-groups]
dev = [
    "cloudfeaster-jetstream[core]",  # jetstream checks itself with its own core pack
    "hatchling==1.33.0",  # for tests of hatch_build.py; keep in step with [build-system]
]

[tool.hatch.build.targets.wheel]
packages = ["src/jetstream"]
# The build hook installs these into .venv/bin, so they aren't package files too.
exclude = ["src/jetstream/bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
# uv installs jetstream into its own .venv in editable mode, and the build
# hook runs for that too, so anything the hook reads must rebuild on change.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "hatch_build.py"},
    {file = "binaries.toml"},
    {file = "src/jetstream/bin/**"},
    {file = "package.json"},
    {file = "package-lock.json"},
]

[tool.jetstream]
packs = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that run-unit-tests.sh leaves out",
]
