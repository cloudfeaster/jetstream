[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "cloudfeaster-jetstream"
version = "0.15.0"
description = "Shared development infrastructure for Cloudfeaster repos: one pinned toolchain, its configuration, CI workflows and Claude Code skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
authors = [
    {name = "Cloudfeaster Solutions Inc."},
]
dependencies = [
    "tomlkit==0.15.2",  # jetstream sync edits pyproject.toml, keeping its comments and formatting
]

[project.optional-dependencies]
# One extra per pack. Each pack's Python tools are exact-pinned here;
# binary and Node tools are bundled into the wheel by hatch_build.py.
core = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",  # the unit-tests hook
    "shellcheck-py==0.11.0.1",
    "sqlfluff==4.5.0",
    "yamllint==1.38.0",
    "zizmor==1.32.0",
]
python = [
    "bandit==1.9.4",
    "coverage==7.17.3",  # core's run-unit-tests.sh uses it when it's installed
    "deptry==0.25.1",
    "licensecheck==2026.0.8",
    "pip-audit==2.10.1",
    "pyscn==1.33.2",
    "ruff==0.17.5",
    "ty==0.0.105",
]
website = []

[project.scripts]
jetstream = "jetstream.cli:main"

[project.urls]
Repository = "https://github.com/cloudfeaster/jetstream"
Issues = "https://github.com/cloudfeaster/jetstream/issues"

[dependency-groups]
dev = [
    "cloudfeaster-jetstream[core,python]",  # jetstream checks itself with its own packs
    "hatchling==1.33.0",  # for tests of hatch_build.py; keep in step with [build-system]
]

[tool.hatch.build.targets.wheel]
packages = ["src/jetstream"]
# The build hook installs these into .venv/bin, so they aren't package files too.
exclude = ["src/jetstream/bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
# uv installs jetstream into its own .venv in editable mode, and the build
# hook runs for that too, so anything the hook reads must rebuild on change.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "hatch_build.py"},
    {file = "binaries.toml"},
    {file = "src/jetstream/bin/**"},
    {file = "package.json"},
    {file = "package-lock.json"},
]

[tool.jetstream]
packs = ["core", "python"]

[tool.deptry]
known_first_party = ["jetstream"]  # under src/, where deptry doesn't look
# The extras are the tools each pack installs, not code jetstream imports.
optional_dependencies_dev_groups = ["core", "python", "website"]

[tool.deptry.per_rule_ignores]
DEP004 = ["hatchling"]  # hatch_build.py is the build hook, and hatchling the build backend

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that run-unit-tests.sh leaves out",
]

[tool.sqlfluff.core]
templater = "jinja"
sql_file_exts = ".sql,.sql.j2"
max_line_length = 256
exclude_rules = "ST06"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "upper"

[tool.ruff]
line-length = 256

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",
    "B011",
    "PT015",
    "SLF001",
    "D203",
    "D213",
    "COM812",
    "TID252",
    "CPY001",
]

[tool.ruff.lint.pylint]
max-statements = 100
max-args = 12
max-returns = 20
max-branches = 30

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.licensecheck]
only_licenses = [
    "MIT",
    "Apache",
    "BSD",
]
ignore_packages = []
